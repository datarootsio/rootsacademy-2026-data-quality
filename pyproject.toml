[project]
name = "rootsacademy-2026-data-quality"
version = "0.1.0"
description = "Roots Academy 2026 — Data Quality session (Dataroots)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eya Akrimi", email = "eya.akrimi@dataroots.io" },
]
license = { text = "MIT" }
dependencies = [
    "soda-core-duckdb>=3.3.22,<3.4",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "ydata-profiling>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# no packages to install; this is a workshop repo, not a library
bypass-selection = true

# -----------------------------------------------------------------------------
# Soda Core — data source configuration
# -----------------------------------------------------------------------------
# We use DuckDB so no cloud credentials are needed. The file `avocados.duckdb`
# is generated by `python data/generate_dirty_data.py` and lives in the repo
# root.
#
# In a real project you'd swap this for Postgres, Snowflake, BigQuery,
# Databricks, etc. — the checks file stays identical.
# -----------------------------------------------------------------------------

data_source avocados:
  type: duckdb
  path: avocados.duckdb
